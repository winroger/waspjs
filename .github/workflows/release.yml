name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify stable tag matches package version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/, 'A stable version is required');
          assert.equal(lock.version, pkg.version, 'Lockfile version mismatch');
          assert.equal(lock.packages[''].version, pkg.version, 'Lockfile root mismatch');
          assert.equal(process.env.GITHUB_REF_NAME, 'v' + pkg.version, 'Tag/version mismatch');
          NODE

      - name: Upgrade npm (Trusted Publishing support)
        run: npm i -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build

      - name: Publish webwaspjs (Trusted Publishing)
        run: npm publish --access public
